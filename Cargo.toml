
[workspace]
members = [
    "add-uuid",
    "archive",
    "cleanup",
    "common",
    "crawler",
    "diff",
    "extractor",
    "index",
    "job-manager",
    "meilisearch_client",
    "publish",
    "retryable_fut",
    "sparql_client",
    "sync-consumer",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["Nordine Bittich"]
description = "Swarm"
documentation = "https://github.com/nbittich/swarm"
repository = "https://github.com/nbittich/swarm"
rust-version = "1.90"
edition = "2024"
license = "MIT"

[workspace.dependencies]
log = "0.4.28"
lazy_static = "1.5.0"
scraper = "0.24.0"
url = "2.5.7"
uuid = { version = "1.18.1" }
regex = "1.11.3"
ego-tree = "0.10.0"
graph-rdfa-processor = "0.3.12"
serial_test = "3.2.0"
test-case = "3.3.1"
env_logger = "0.11.8"
tortank = "0.30.7"
async_zip = "0.0.18"
tikv-jemallocator = "0.6.0"
tokio = "1.47.1"
tower-http = "0.6.6"
reqwest = "0.12.23"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
chrono = "0.4.42"
anyhow = "1.0.10"
rand = "0.9.2"
serde = "1.0.228"
slab = "0.4.11"
serde_json = "1.0.145"
async-nats = "0.44.1"
mongodb = "3.3.0"
futures = "0.3.31"
bincode = "2.0.1"
axum = "0.8.6"
axum-extra = "0.10.3"
jsonwebtoken = "10.0.0"
bcrypt = "0.17.1"
http-cache-reqwest = "0.16.0"
reqwest-middleware = "0.4.2"
mimalloc = "0.1.48"
flate2 = "1.1.3"
async-compression = "0.4.32"
moka = "0.12.11"
itertools = "0.14.0"
cron = "0.15.0"
tokio-util = "0.7.16"
mime_guess = "2.0.5"
spargebra = "0.4.0"
xxhash-rust = "0.8.15"
bson = "3.0.0"
trait-variant = "0.1.2"
async-trait = "0.1.89"
mlua = "0.11.4"
meilisearch-sdk = "0.30.0"
async_fn_traits = "0.1.1"
tokio-stream = "0.1.17"
serde_urlencoded = "0.7.1"
form_urlencoded = "1.2.2"
reqwest-tracing = "0.5.8"
http = "1.3.1"

swarm_common = { version = "0.1.0", path = "./common" }
swarm_retryable_fut = { version = "0.1.0", path = "./retryable_fut" }
sparql_client = { version = "0.1.0", path = "./sparql_client" }
swarm_meilisearch_client = { version = "0.1.0", path = "./meilisearch_client" }

[profile.release]
opt-level = 'z'   # Optimize for size.
lto = true        # Link Time Optimization (LTO)
codegen-units = 1 # Set this to 1 to allow for maximum size reduction optimizations:
panic = 'abort'   # removes the need for this extra unwinding code.
strip = "symbols"
